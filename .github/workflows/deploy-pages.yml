name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一次进行中的部署；不取消进行中的那次，避免部署到一半被打断。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 输出真实的 Pages origin / base_path（含之后可能配置的自定义域名），
      # 不靠猜仓库名，切自定义域名时 base_path 会自动变成空串。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # DEPLOY_TARGET 让 astro.config.mjs 切到 GitHub Pages 形态
      # （子路径 base + build.format: 'file'）；SITE_URL / BASE_PATH 覆盖默认值。
      - name: Build
        env:
          DEPLOY_TARGET: github-pages
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
